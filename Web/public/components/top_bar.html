<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Top Bar</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
<header id="topbar" class="topbar">
    <div class="topbar-left">
        <!-- No Patrick, these aren't errors, turns out that when importing components, the source scales with the importing page, not the component one -->
        <img src="resources/placeholder.png" alt="UTR logo">
        <img src="resources/placeholder.png" alt="Wildcats logo">
        <div class="topbar-title">
            <p id="page_name">SIAC</p>
            <p id="full_name">Sistema Integrado de Asistencias y Creditos</p>
        </div>
    </div>
    <div class="topbar-right">
        <button class="user-button" type="button" aria-label="Open user menu">
            <img src="resources/placeholder.png" alt="">
            <span class="user-name">Full Name <span aria-hidden="true">∨</span></span>
        </button>
    </div>
</header>
</body>
</html>
